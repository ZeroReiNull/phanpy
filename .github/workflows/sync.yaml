name: Sync Fork

on:
  schedule:
    - cron: "6 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [main, production]

    steps:
      - name: Sync ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.branch }}
        run: |
          gh api \
            --method POST \
            "repos/$GH_REPO/merge-upstream" \
            -f branch="$BRANCH"
